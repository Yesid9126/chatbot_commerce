{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <title>eCommerce</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.11.2/css/all.css">
  <!-- Bootstrap core CSS -->
  <link href="{% static 'css/bootstrap.min.css'%}" rel="stylesheet">
  <!-- Material Design Bootstrap -->
  <link href="{% static 'css/mdb.min.css' %}" rel="stylesheet">
  <!-- Your custom styles (optional) -->
  <link href="{% static 'css/style.min.css' %}" rel="stylesheet">

  <style type="text/css">
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh
    }

  </style>
</head>

<body>


  <div class="container-fluid m-0 p-0">
    <!--Header-->
    <div class="row  ">
      <nav class="navbar fixed-top navbar-expand-lg navbar-light white scrolling-navbar">

        <a class="navbar-brand pl-3" id="navbar1" href="{% url 'ecommerce:store' %}">
          Stores
        </a>
    </div>
    <!--/Header-->

<div class="row flex-grow-1 mt-5">
      <div class="container mt-5">
        <div class="row" style="min-height:85vh">
          <div class="col-12 justify-content-center align-content-center">
            <section class="text-center mb-4">
              <!--Grid row-->
              <div
                class="row equal wow fadeIn row equal wow fadeIn justify-content-center align-content-center flex-column">
                {% for store in object_list %}
                <!--Grid column-->
                <div class="col-lg-3 col-md-4 mb-4">
                  <!--Card-->
                  <div class="card">
                    <!--Card content-->
                    <div class="card-body text-center ">
                      <!--Category & Title-->
                      <a href="{% url 'ecommerce:home' store.name %}" class="grey-text">
                        <h5 class="card-title" >{{ store.name }}</h5>
                      </a>
                    </div>
                    <!--Card content-->
                  </div>
                  <!--Card-->
                </div>

                {% endfor %}
              </div>

            </section>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer-->
    <div class="row ">
      <div class="col-12">
        {% include "footer.html" %}
      </div>
    </div>
  </div>
  <!-- Footer-->
</body>

</html>
